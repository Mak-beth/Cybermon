{% extends "base.html" %}
{% block title %} — Trend{% endblock %}

{% block content %}
<h1>Violation Trend <span class="dim" style="font-size:1rem;font-weight:400">last 7 days</span></h1>

{% if labels %}
<div class="card">
  <div class="chart-wrap tall">
    <canvas id="trendChart"></canvas>
  </div>
</div>
{% else %}
<p class="empty">No violations in the last 7 days.</p>
{% endif %}
{% endblock %}

{% block scripts %}
{% if labels %}
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script>
  initTrendChart({{ labels | tojson }}, {{ counts | tojson }});
</script>
{% endif %}
{% endblock %}
