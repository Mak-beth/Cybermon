mode: standalone
setup_complete: true
ui:
  theme: light
server:
  host: 0.0.0.0
  port: 5001
  api_key: "CHANGE_ME_BEFORE_DEPLOY"   # shared secret for agent->server auth
agent:
  server_ip: 127.0.0.1
  server_port: 5001
  log_path: logs/auth.log
  host_id: agent-machine-1
  retry_attempts: 3
  retry_delay_seconds: 2
detection:
  failed_logins:
    threshold: 2
    time_window_minutes: 10
  unauthorized_access:
    restricted_resources:
    - /admin
    - /wp-admin
    - /phpmyadmin
    - /config
    - /.env
    - /var/www/html
    trigger_codes:
    - 403
    - 401
  off_hours_logins:
    business_days:
    - 0
    - 1
    - 2
    - 3
    - 4
    business_hours_start: 08:00
    business_hours_end: '18:00'
scoring:
  severity_tiers:
    low:
      min: 1
      max: 4
    medium:
      min: 5
      max: 9
    high:
      min: 10
      max: 16
    critical:
      min: 17
      max: 25
  rules:
    high_impact_users:
    - root
    - admin
    high_impact_resources:
    - /admin
    - /.env
    - /phpmyadmin
    med_impact_resources:
    - /config
    - /wp-admin
    failed_login_likelihood_bands:
    # count <= max_count gets this likelihood; evaluated in order, first match wins
    - { max_count: 5,     likelihood: 2 }
    - { max_count: 9,     likelihood: 3 }
    - { max_count: 19,    likelihood: 4 }
    - { max_count: 99999, likelihood: 5 }   # catch-all
    unauthorized_access_default_likelihood: 3
    off_hours_default_likelihood: 2
    off_hours_default_impact: 3
    failed_login_high_user_impact: 4
    failed_login_default_impact: 2
    unauthorized_access_high_resource_impact: 5
    unauthorized_access_med_resource_impact: 3
    unauthorized_access_default_impact: 2
storage:
  db_path: data/cybermon.db
dashboard:
  host: 127.0.0.1
  port: 5000
  debug: false
  export_path: exports/
auth_log_path: logs/auth.log
web_log_path: logs/access.log
